[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = 192.168.1.100
upload_protocol = espota
upload_flags =
    --auth=YOUR_OTA_PASSWORD
    --timeout=300
lib_deps =
    adafruit/DHT sensor library
    claws/BH1750
    adafruit/Adafruit BME280 Library
    milesburton/DallasTemperature
    ESP32Async/AsyncTCP@3.3.2
    me-no-dev/ESPAsyncWebServer@3.6.0
    arduino-libraries/NTPClient
    bblanchon/ArduinoJson@6.21.5
    sensirion/Sensirion I2C SPS30
    sparkfun/SparkFun AS3935 Lightning Sensor Library
lib_ldf_mode = chain

; Uncomment and adjust for your network:
; build_flags =
;     -D WIFI_SSID='"YourSSID"'
;     -D WIFI_PASSWORD='"YourPassword"'
;     -D TELEGRAM_BOT_TOKEN='"123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"'
;     -D TELEGRAM_CHAT_ID_VALUE='"123456789"'
